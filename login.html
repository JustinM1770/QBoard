<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QBoard CRM — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="qb"><b>Qb</b></div>
        <div class="t"><b>QBoard</b><small>CRM</small></div>
      </div>
      <h2>Inicia sesión</h2>
      <p class="sub">Accede para gestionar tus clientes</p>

      <form id="f">
        <label>Correo electrónico</label>
        <input type="email" id="correo" value="admin@crm.mx" required autocomplete="username">
        <label>Contraseña</label>
        <input type="password" id="password" value="admin123" required autocomplete="current-password">
        <button class="btn" type="submit">Entrar</button>
        <p class="err oculto" id="err">Correo o contraseña incorrectos</p>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('err').classList.add('oculto');
      try {
        const res = await fetch('api/auth.php', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ correo: correo.value, password: password.value })
        });
        const d = await res.json();
        if (d.token) {
          localStorage.setItem('crm_token', d.token);
          localStorage.setItem('crm_usuario', JSON.stringify(d.usuario));
          location.href = 'index.html';
        } else {
          document.getElementById('err').classList.remove('oculto');
        }
      } catch { document.getElementById('err').classList.remove('oculto'); }
    });
  </script>
</body>
</html>
