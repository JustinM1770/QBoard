<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QBoard CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="side">
      <div class="brand">
        <div class="qb"><b>Qb</b></div>
        <div class="t"><b>QBoard</b><small>CRM</small></div>
      </div>
      <a data-vista="dashboard" class="activo">Dashboard</a>
      <a data-vista="clientes">Clientes</a>
      <a data-vista="actividad">Mi actividad</a>
      <a data-vista="reportes">Reportes</a>
      <a class="salir" id="salir">Cerrar sesión</a>
    </aside>

    <!-- Main -->
    <div class="main">
      <div class="top">
        <div class="user" id="topTitulo" style="color:var(--ink);font-weight:600">Dashboard</div>
        <div class="user"><span id="uNombre">Admin</span><span class="av" id="uAvatar">A</span></div>
      </div>
      <div class="content">
        <div id="vista-dashboard"></div>
        <div id="vista-clientes" class="oculto"></div>
        <div id="vista-detalle" class="oculto"></div>
        <div id="vista-actividad" class="oculto"></div>
        <div id="vista-reportes" class="oculto"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
